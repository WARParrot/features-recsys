name: recsys-artifact

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q src tests tools
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --no-build-isolation . -w /tmp/recsys-wheel
      - run: python -m pip install --no-deps --force-reinstall /tmp/recsys-wheel/*.whl
      - run: python -c "import recsys_corrected_artifact.compare_methods, recsys_corrected_artifact.kion_data"
      - run: python -m recsys_corrected_artifact.validate_protocol results/archive/v4/kion_50k_protocol_v4.json
      - run: python -m recsys_corrected_artifact.compare_methods --evaluation single_split --n-events 500 --seeds 42 --json > /tmp/recsys-smoke.json
      - run: python -m recsys_corrected_artifact.validate_protocol /tmp/recsys-smoke.json
