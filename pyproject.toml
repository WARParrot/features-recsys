[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-corrected-artifact"
version = "0.1.0"
description = "Causal temporal recommender-system feature comparison artifact"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "lightgbm==4.6.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
recsys-compare = "recsys_corrected_artifact.compare_methods:main"
recsys-validate-results = "recsys_corrected_artifact.validate_protocol:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
